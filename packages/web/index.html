<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D 导演台 · Director Stage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      background: #f7f5f0;
      color: #14171e;
      font-family: 'Outfit', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }
    /* loading spinner · Vite 编译完成后会自动隐藏 */
    .app-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f5f0; z-index: 9999; transition: opacity .4s ease; }
    .app-loader.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e9e3d6; border-top-color: #c97b3f; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-loader" id="app-loader">
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // 隐藏 loading spinner（Vite 编译完成后 main.tsx 跑起来时）
    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => {
        const l = document.getElementById('app-loader');
        if (l) l.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
